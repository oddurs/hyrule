name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain and its components come from rust-toolchain.toml, which
      # rustup honours automatically on first use.
      - name: Show the pinned toolchain
        run: rustup show active-toolchain

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The same entry point the git hooks call, so CI and local checks cannot
      # drift apart.
      - name: scripts/task check
        run: ./scripts/task check

  required:
    name: required
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: Fail unless every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "a required job did not succeed" >&2
            exit 1
          fi
