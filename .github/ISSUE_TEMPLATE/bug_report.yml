name: Bug report
description: Something behaves differently from how it is documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security problem, please close this
        and use [private reporting](https://github.com/oddurs/hyrule/security/advisories/new)
        instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the exact output if there was any.
      placeholder: hyrule printed ... but the help text says it should print ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The exact commands, in order. A rough reproduction still helps.
      value: |
        1.
        2.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `hyrule --version`, or the commit you built from.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and architecture.
      placeholder: macOS 15.4, arm64
    validations:
      required: true
