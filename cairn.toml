# cairn.toml — the schema for this project's roadmap and issues.
#
#   cairn config          show the resolved schema
#   cairn check           validate every item against it
#   cairn board           what is in flight
#   cairn next            what is ready to pick up
#   man cairn             full reference

format = 2

[project]
name = "hyrule"
description = "A prompt library for agentic coding, rendered into the projects that use it."
dir = "cairn/items"
id_width = 4
default_type = "feature"
default_status = "backlog"
url = "https://github.com/oddurs/hyrule/blob/main"

# ─── Item types ──────────────────────────────────────────────────────────────

[[type]]
name = "feature"
icon = "+"
color = "cyan"
template = """
## Problem

## Proposal

## Acceptance criteria

- [ ]
"""

[[type]]
name = "bug"
icon = "!"
color = "red"
template = """
## What happens

## What should happen

## Reproduction

1.
"""

[[type]]
name = "chore"
icon = "~"
color = "gray"

[[type]]
name = "spike"
icon = "?"
color = "magenta"
description = "a question that has to be answered before the work can be scoped"
template = """
## Question

## Why it needs answering first

## What would settle it

## Answer

<!-- Filled in when the spike closes. A spike that closes without an answer
     recorded was a waste of the time it took. -->
"""

[[type]]
name = "docs"
icon = "*"
color = "blue"

[[type]]
name = "milestone"
description = "a release, or whatever this project ships"

# ─── Statuses ────────────────────────────────────────────────────────────────
# Order is the column order on the board and the sort order in listings.
# `category` is what the tool reasons about, so the names are free.

[[status]]
name = "backlog"
category = "open"
color = "gray"

[[status]]
name = "planned"
category = "open"
color = "blue"

[[status]]
name = "doing"
label = "in progress"
category = "active"
color = "yellow"

[[status]]
name = "blocked"
category = "active"
color = "red"

[[status]]
name = "review"
label = "in review"
category = "active"
color = "magenta"

[[status]]
name = "done"
category = "done"
color = "green"

[[status]]
name = "dropped"
category = "dropped"
color = "gray"
board = false

# ─── Custom fields ───────────────────────────────────────────────────────────

[[field]]
name = "priority"
kind = "enum"
values = ["p0", "p1", "p2", "p3"]
default = "p2"
column = true
description = "p0 blocks the milestone it is filed under"

[[field]]
name = "effort"
kind = "enum"
values = ["s", "m", "l", "xl"]
description = "Rough size, not an estimate"

[[field]]
name = "area"
kind = "enum"
values = [
  "library",    # the asset store: files, frontmatter, ids, the index
  "profile",    # named bundles of assets, and how they compose
  "render",     # templating and the target renderers
  "apply",      # planning and writing into a project
  "drift",      # detecting local edits, diffing them, promoting them back
  "sync",       # the library as a git repository
  "config",     # hyrule.toml, variable resolution, discovery
  "cli",        # the command surface, output, exit codes
  "tui",        # the browser
  "docs",
  "packaging",  # release, install, completions, the man page
  "meta",       # the repository's own workflow
]
column = true
description = "Subsystem this touches"

[[field]]
name = "due"
kind = "date"
description = "when a milestone is meant to land"

[[field]]
name = "milestone"
kind = "ref"
target = "milestone"
by = "key"
rollup = true
inverse = "scheduled"
description = "what this ships in"

# ─── Saved views ─────────────────────────────────────────────────────────────

[[view]]
name = "now"
description = "What is actually being worked on"
filter = "category=active"
sort = "priority,id"

[[view]]
name = "next"
description = "Planned work, nearest milestone first"
filter = "status=planned"
sort = "milestone,priority"

[[view]]
name = "loop"
description = "The apply/diff/promote cycle — the product's whole reason to exist"
filter = "area=apply|drift|render,category!=done"
sort = "milestone,priority"

[[view]]
name = "open-questions"
description = "Spikes still to be answered"
filter = "type=spike,category!=done"
sort = "milestone,id"

[[view]]
name = "blockers"
description = "Everything that would hold a milestone"
filter = "priority=p0,category!=done"
sort = "milestone,id"

[[view]]
name = "triage"
description = "Items that still need a milestone or a priority"
filter = "milestone=,category!=done"
columns = ["id", "type", "title", "created"]

# ─── Hooks ───────────────────────────────────────────────────────────────────
# A roadmap that drifts from the items is exactly the rot cairn exists to
# prevent, so rendering is not left to anybody's discipline.

[hooks]
after-create = "cairn render -q"
after-change = "cairn render -q"
after-remove = "cairn render -q"

# ─── Rendered roadmap ────────────────────────────────────────────────────────

[render]
target = "ROADMAP.md"
title = "Roadmap"
group_by = "milestone"
include = "category!=dropped"
checkbox = true
show_ids = true
progress = true
group_by_status = true
link_items = true
